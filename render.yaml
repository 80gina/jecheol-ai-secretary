services:
  - type: web
    name: seasonal-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: USE_MEMORY_DB
        value: "false"
      # LLM 공급자. 주소를 비우면 OpenAI, 아래처럼 두면 Gemini 의 OpenAI 호환
      # 엔드포인트로 붙는다. 코드는 그대로 두고 이 두 줄만 바꾸면 갈아끼워진다.
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        value: gemini-2.5-flash
      # 600 은 GPT 기준이었다. Gemini 2.5 는 생각 토큰과 답변 토큰이 이 예산을
      # 나눠 쓰므로 여유를 둔다. 상한 자체는 그대로 있으니 과금 안전장치는 유지된다.
      - key: OPENAI_MAX_TOKENS
        value: "1500"
      # 아래 두 개는 Render 대시보드에서 직접 입력 (값을 저장소에 두지 않는다)
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
